[project]
name = "guardtrain"
version = "0.1.0"
description = "Fine-tune and evaluate the checkout guard (Veri QLoRA, local GGUF, offline eval)."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "httpx>=0.27",
  "uvicorn>=0.27",
]

[project.optional-dependencies]
api = ["anthropic>=0.40", "openai>=1.40"]
merge = ["torch>=2.2", "transformers>=4.51", "peft>=0.13"]
convert = ["huggingface_hub>=0.26", "gguf>=0.10"]
dev = ["pytest>=8.0"]

[project.scripts]
guardtrain = "guardtrain.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["guardtrain*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
