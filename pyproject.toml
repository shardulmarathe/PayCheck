[project]
name = "paycheck"
version = "0.1.0"
description = "PayCheck gym: fake stores, trick specs, and labeled pages for a shopping-agent guard."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "cryptography==41.0.7",
  "jinja2==3.1.6",
  "jsonschema==4.26.0",
  "playwright==1.64.0",
  "rapidfuzz==3.14.6",
  "scikit-learn==1.9.1",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "browser-use==0.13.11", "pillow==12.3.0"]
shopper = ["browser-use==0.13.11", "pillow==12.3.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gym*", "shopper*", "visa*"]

[tool.setuptools.package-data]
gym = ["templates/*.html", "templates/*.j2", "schema/*.json", "schema/*.md"]
shopper = ["schema/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
